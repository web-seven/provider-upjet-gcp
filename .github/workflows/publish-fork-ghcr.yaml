name: Publish Provider Packages (fork GHCR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the packages (e.g. v2.7.0)"
        default: 'v2.7.0'
        required: true
      subpackages:
        description: 'Subpackages to build, space separated (config is the family package)'
        default: 'config cloudplatform sql'
        required: true
      platforms:
        description: 'Platforms to build for'
        default: 'linux_amd64'
        required: false
      concurrency:
        description: 'Number of parallel package builds'
        default: '2'
        required: false
      go_version:
        description: 'Go version to use'
        default: '1.25.11'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGORG: ghcr.io/${{ github.repository_owner }}
      # on a tag push the inputs are empty, so fall back to the tag name / defaults
      PKG_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PKG_SUBPACKAGES: ${{ github.event.inputs.subpackages || 'config cloudplatform sql' }}
      PKG_PLATFORMS: ${{ github.event.inputs.platforms || 'linux_amd64' }}
      PKG_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
      GO_VERSION: ${{ github.event.inputs.go_version || '1.25.11' }}

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        if: contains(env.PKG_PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
        with:
          version: 'v0.20.1'
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@6edd4406fa81c3da01a34fa6f6343087c207a568 # v3
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go_cache
        run: |
          echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT && \
          echo "mod_cache=$(make go.mod.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ${{ steps.go_cache.outputs.cache }}
          key: ${{ runner.os }}-build-publish-fork-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-publish-fork-

      - name: Cache Go Dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: ${{ steps.go_cache.outputs.mod_cache }}
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Build Artifacts
        run: |
          make -j 2 \
            SUBPACKAGES="${PKG_SUBPACKAGES}" \
            PLATFORMS="${PKG_PLATFORMS}" \
            BATCH_PLATFORMS="$(echo "${PKG_PLATFORMS}" | tr ' ' ',')" \
            REGISTRY_ORGS="${REGORG}" \
            XPKG_REG_ORGS="${REGORG}" \
            XPKG_REG_ORGS_NO_PROMOTE="${REGORG}" \
            CONFIG_DEPENDENCY_REG_ORG="${REGORG}" \
            BRANCH_NAME="main" \
            VERSION="${PKG_VERSION}" \
            build.all
        env:
          # docker buildx does not load the images it builds by default
          BUILD_ARGS: "--load"

      - name: Publish Artifacts
        run: |
          make \
            SUBPACKAGES="${PKG_SUBPACKAGES}" \
            PLATFORMS="${PKG_PLATFORMS}" \
            BATCH_PLATFORMS="$(echo "${PKG_PLATFORMS}" | tr ' ' ',')" \
            REGISTRY_ORGS="${REGORG}" \
            XPKG_REG_ORGS="${REGORG}" \
            XPKG_REG_ORGS_NO_PROMOTE="${REGORG}" \
            CONFIG_DEPENDENCY_REG_ORG="${REGORG}" \
            CONCURRENCY="${PKG_CONCURRENCY}" \
            BRANCH_NAME="main" \
            VERSION="${PKG_VERSION}" \
            publish
